# Builds MacUtility.app on every push and PR that touches the Swift app, runs
# the unit tests, and leaves the app zipped in the run's artifacts. Signed with
# the Developer ID when the secrets are set (see .github/scripts/macos-build.sh).
# Run it by hand with "notarize" for a build that opens on any Mac.
#
# Releasing: bump the version, add its CHANGELOG.md section, push to main, then
# push the tag v<version>. The tag builds and notarizes the DMG, signs it for
# over-the-air updates, writes appcast.xml and publishes the GitHub release.
# Installed copies find the update through releases/latest/download/appcast.xml.
#
# On the Mac: gh run download -R giovaniif/mac-utility -n MacUtility <run-id>
name: macOS

on:
  push:
    branches: ["**"]
    # Path filters don't apply to tags: a release tag always builds.
    tags: ["v*"]
    paths: ["MacUtility/**", "MacUtilityTests/**", "project.yml", ".github/workflows/macos.yml", ".github/scripts/macos-build.sh"]
  pull_request:
    paths: ["MacUtility/**", "MacUtilityTests/**", "project.yml", ".github/workflows/macos.yml", ".github/scripts/macos-build.sh"]
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the app
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - run: xcodebuild -version && brew install xcodegen

      - uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build MacUtility.app
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARIZE: ${{ (inputs.notarize || startsWith(github.ref, 'refs/tags/v')) && '1' || '0' }}
        run: .github/scripts/macos-build.sh

      - uses: actions/upload-artifact@v6
        with:
          name: MacUtility
          path: |
            MacUtility-*.zip
            MacUtility-*.dmg
            appcast.xml
            release-notes.md
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - run: xcodebuild -version && brew install xcodegen

      - uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Unit tests
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild test -project MacUtility.xcodeproj -scheme MacUtility -destination "platform=macOS" \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGN_IDENTITY=- \
            | xcbeautify --renderer github-actions

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: MacUtility

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dmg="MacUtility-$version.dmg"
          test -f "$dmg" && test -f appcast.xml && test -f release-notes.md
          {
            echo "macOS: signed with Developer ID and notarized. Installed copies update themselves; for a first install, download \`$dmg\`, open it and drag Mac Utility into Applications."
            echo
            cat release-notes.md
            echo
            echo "Windows and Linux builds are unchanged; get them from 0.1.9."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Mac Utility $version" --notes-file notes.md "$dmg" appcast.xml
