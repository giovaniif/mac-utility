[package]
name = "utility"
version = "0.1.0"
edition = "2021"
description = "Windows and Linux port of Mac Utility"
publish = false

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["image-data"] }
directories = "5"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
global-hotkey = { version = "0.6", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tray-icon = "0.19"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = { version = "0.13", features = ["xtest", "randr"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
